<!DOCTYPE html>
<html>
<head>
    <title>Chat Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="box">
        {% with messages = get_flashed_messages() %}
            {% for m in messages %}
                <p class="flash">{{ m }}</p>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
